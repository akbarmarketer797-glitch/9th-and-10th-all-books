
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>9th Class Physics PDF | 2026/2027</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f8ff;
    color: #172554;
}

.header {
    background: linear-gradient(135deg, #0066ff, #00bfff);
    color: white;
    text-align: center;
    padding: 35px 15px;
    margin-top: 0;
    box-shadow: 0 4px 15px #0002;
}

.header h1 {
    font-size: clamp(23px, 4vw, 36px);
    margin-bottom: 10px;
}

/* Animated Back to Home button */
.back-home {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 1000;
    text-decoration: none;
    color: white;
    background: linear-gradient(135deg, #0066ff, #00bfff);
    padding: 12px 19px;
    border-radius: 30px;
    font-weight: bold;
    box-shadow: 0 4px 12px #0003;
    animation: slideIn 0.7s ease-out;
    transition: transform 0.25s;
}

.back-home:hover {
    transform: scale(1.06);
}

@keyframes slideIn {
    from {
        transform: translateX(-150%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

.container {
    width: 94%;
    max-width: 1100px;
    margin: 30px auto;
}

.pdf-card {
    background: white;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 5px 22px #0066ff15;
    border: 1px solid #dbeafe;
    text-align: center;
}

.pdf-card h2 {
    color: #0066ff;
    margin-bottom: 12px;
}

.pdf-card p {
    margin-bottom: 20px;
    line-height: 1.6;
}

.pdf-viewer {
    width: 100%;
    height: 70vh;
    min-height: 400px;
    border: 2px solid #b9ddff;
    border-radius: 10px;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
}

.btn {
    display: inline-block;
    text-decoration: none;
    background: linear-gradient(135deg, #0066ff, #00bfff);
    color: white;
    padding: 13px 22px;
    border-radius: 25px;
    font-weight: bold;
    transition: transform 0.2s;
}

.btn:hover {
    transform: translateY(-2px);
}

.footer {
    text-align: center;
    padding: 22px 10px;
    color: #64748b;
}

@media (max-width: 600px) {
    .header {
        padding: 75px 12px 25px;
    }

    .back-home {
        top: 10px;
        left: 10px;
        padding: 10px 14px;
        font-size: 13px;
    }

    .pdf-card {
        padding: 14px;
    }

    .pdf-viewer {
        height: 65vh;
        min-height: 350px;
    }
}
</style>
</head>

<body>

<!-- Back to Home -->
<a href="index.html" class="back-home">
    ← Back to Home
</a>

<!-- Website Title -->
<header class="header">
    <h1>9th &amp; 10th Class All Books 2026/2027</h1>
    <p>Physics PDF • Study, Read and Learn</p>
</header>

<main class="container">
    <section class="pdf-card">

        <h2>📘 9th Class Physics Book</h2>
        <p>Open or read your Physics book below.</p>

        <!-- PDF Viewer -->
        <iframe
            id="pdfViewer"
            class="pdf-viewer"
            title="Physics PDF"
            src="about:blank">
        </iframe>

        <div class="buttons">
            <a id="openPdf" class="btn"
               href="#" target="_blank"
               rel="noopener noreferrer">
                📖 Open PDF
            </a>

            <a id="downloadPdf" class="btn"
               href="#">
                ⬇ Download PDF
            </a>
        </div>

    </section>
</main>

<footer class="footer">
    © 2026–2027 9th &amp; 10th Class All Books
</footer>

<script>
/* YOUR PDF FILE PATH */
const PDF_LINK =
    "file:///C:/Users/Super/Downloads/physics%20book.pdf";

document.getElementById("pdfViewer").src = PDF_LINK;
document.getElementById("openPdf").href = PDF_LINK;
document.getElementById("downloadPdf").href = PDF_LINK;
</script>

</body>
</html>
